<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1258 432" width="1258" height="432" role="img" aria-labelledby="dh-title dh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="dh-title">How discussion-helper works: the loop that listens, answers and speaks — and stops the moment you cut in</title>
  <desc id="dh-desc">A left-to-right plate, and the only member that is a loop rather than a pipeline. In: a person speaking. The work, in three numbered stages: vocal-helper hears, turning the microphone into transcribed turns; a local language model answers, with no cloud call; and speaker-helper speaks the reply. Across all three runs the thing that makes it a conversation rather than a pair of tools: the floor, which decides whose turn it is, barge-in, which cuts the reply off the instant the user starts talking again, and a latency budget that keeps the gap short enough to feel like a conversation. Out: a spoken reply that yields when interrupted.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="181" height="78" rx="10"/>
  <text class="n-title" x="118" y="120" text-anchor="middle">a person speaking</text>
  <text class="n-sub" x="118" y="139" text-anchor="middle">into the microphone</text>
  <path class="flow" d="M215 126 H231" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="235" y="54" width="765" height="144" rx="12"/>
  <text class="panel-label" x="255" y="76">WHAT IT DOES</text>
  <rect class="stage" x="255" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="376" y="127" text-anchor="middle">hear</text>
  <text class="n-sub" x="376" y="146" text-anchor="middle">vocal-helper: turns, transcribed</text>
  <text class="step" x="266" y="110">1</text>
  <path class="flow" d="M502 133 H518" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="524" y="94" width="206" height="78" rx="10"/>
  <text class="n-title" x="627" y="127" text-anchor="middle">answer</text>
  <text class="n-sub" x="627" y="146" text-anchor="middle">a local LLM, no cloud call</text>
  <text class="step" x="535" y="110">2</text>
  <path class="flow" d="M734 133 H750" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="756" y="94" width="224" height="78" rx="10"/>
  <text class="n-title" x="868" y="127" text-anchor="middle">speak</text>
  <text class="n-sub" x="868" y="146" text-anchor="middle">speaker-helper, interruptible</text>
  <text class="step" x="767" y="110">3</text>
  <path class="flow" d="M1006 126 H1022" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1026" y="40">OUT</text>
  <rect class="io" x="1026" y="87" width="204" height="78" rx="10"/>
  <text class="n-title" x="1128" y="120" text-anchor="middle">a spoken reply</text>
  <text class="n-sub" x="1128" y="139" text-anchor="middle">that stops when you cut in</text>
  <rect class="core" x="413" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="629" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="629" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M629 286 V314 H365 V332"/>
  <path class="tie" d="M629 314 H893 V332"/>
  <path class="tie" d="M365 314 V332"/>
  <rect class="surface" x="290" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="365" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M541 314 V332"/>
  <rect class="surface" x="466" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="541" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M717 314 V332"/>
  <rect class="surface" x="642" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="717" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M893 314 V332"/>
  <rect class="surface" x="818" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="893" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="629" y="412" text-anchor="middle">The floor, barge-in and the latency budget are the package: the three stages already existed as separate helpers.</text>
</svg>
