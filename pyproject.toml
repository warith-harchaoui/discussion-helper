[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discussion-helper"
version = "0.2.1"
description = "Hold a spoken conversation: listen, answer, speak — and stop the moment the user cuts in. The loop over vocal-helper (hearing), a local language model (answering) and speaker-helper (speaking), with the floor, barge-in and the latency budget handled properly."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai" }]
keywords = [
    "voice-agent", "conversation", "speech", "barge-in", "turn-taking",
    "full-duplex", "realtime", "local-first", "stt", "tts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime contract: the base install has no model, no microphone and no sound
# card in it. It carries the loop — the floor, the interruption, the timings —
# and the three protocols the loop is written against. That is deliberate: it
# is what lets the hard part be tested in CI, and what lets somebody bring
# their own recogniser without uninstalling ours.
dependencies = [
    # Capped below 3 like everywhere else in the suite: a major bump is where
    # os-helper is allowed to move a name we call, and the two names we call
    # (`init_logging`, `warning`) are not worth a surprise traceback at import
    # time. The floor is 2.0.0 rather than the 1.7.2 declared until now, which
    # claimed support for a line this package has never once been tested on.
    "os-helper>=2.0.0,<3",
    # `discussion-helper` — the headline command, the one the README tells you
    # to run — is the click front door. Until 0.1.0 click was declared nowhere:
    # not a dependency, not an extra, so `pip install discussion-helper` put a
    # command on the PATH that answered a traceback about a package the reader
    # had never heard of. Only a clean virtualenv shows that; in a checkout
    # click is always already there.
    #
    # At base rather than behind an extra, unlike the sprezzature bricks whose
    # argparse door is the headline one and whose audit runs on the standard
    # library alone. Here the click door *is* the product, and
    # best-engine-ai-helper makes the same call for the same reason.
    "click>=8.1",
]

[project.optional-dependencies]
# Hearing. vocal-helper brings Silero VAD, semantic end-of-turn detection and
# whisper.cpp; capture-helper brings the microphone it listens to.
listen = [
    # The floor is the major line this adapter is actually written against:
    # `voh.Pipeline` / `voh.PipelineConfig`, and events that are TypedDicts.
    # It read `>=0.4.4` until now — two breaking-change boundaries below the
    # 2.x published today, which is to say it claimed support for a line this
    # package has never run on.
    #
    # The ceiling moved to <4 once 3.0.0 was actually run here, not merely
    # read: its two breaking changes land elsewhere. `Pipeline.run()` raising
    # `StageCrashed` instead of yielding nothing is what this adapter wants —
    # a dead recogniser used to reach the responder as silence — and the
    # pyannote default only moves the offline checkpoint, which the listening
    # path never loads. The 63 tests pass against 3.0.0.
    "vocal-helper>=2.0.0,<4",
    # Not imported here: it is what vocal-helper's microphone source opens.
    # Declared anyway, and at its real major, so `[listen]` resolves to a
    # combination that has been run rather than one that merely solves.
    "capture-helper>=1.0.0,<2",
]
# Speaking, in this process. Kokoro, no server.
# Capped below 1 because 0.x promises nothing across minors, and `Settings`,
# `Settings.from_mapping` and `Speaker` are all read straight from it.
speak = ["speaker-helper[kokoro,detect]>=0.8.0,<1"]
# Answering, with whatever model fits this machine.
# `llm.chat` and `llm.chat_stream`, verified against 1.4.x. The old `>=0.4.0`
# predated the 1.0 boundary entirely.
think = ["best-engine-ai-helper>=1.4.0,<2"]
# Playing the audio out. Separate from `speak` because a caller that pipes the
# audio somewhere else — a phone line, a browser — needs the voice and not the
# sound card.
play = ["sounddevice>=0.4", "numpy>=1.24"]
all = ["discussion-helper[listen,speak,think,play]"]
# The HTTP surface: sessions you can watch, interrupt and end, plus the
# WebSocket that carries a remote client's audio both ways.
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "websockets>=12"]
# The same routes republished as agent tools. `mcp<2.0` is a pin with a
# history: fastapi-mcp 0.4.0 against an unpinned mcp SDK raised a TypeError
# out of create_app() — not an ImportError — and that took down a sibling's
# entire HTTP API, not only its MCP routes.
mcp = ["discussion-helper[server]", "fastapi-mcp>=0.3", "mcp<2.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    # The microphone-path tests read PCM frames, which are numpy arrays.
    "numpy>=1.24",
    # Reads pyproject.toml in the console-script guard. Only needed below
    # 3.11, where tomllib is not yet in the standard library.
    'tomli>=2.0; python_version < "3.11"', "httpx2>=2.0.0"]

[project.scripts]
discussion-helper = "discussion_helper.cli_click:main"
discussion-helper-argparse = "discussion_helper.cli:main"
discussion-helper-mcp = "discussion_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/discussion-helper"
Issues = "https://github.com/warith-harchaoui/discussion-helper/issues"

[tool.setuptools.packages.find]
include = ["discussion_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
# Targets 3.12, while the package itself supports 3.10 (`requires-python`
# above). Not a preference: NumPy ships its stubs in PEP 695 syntax
# (`type X = ...`), which mypy can only *parse* when targeting 3.12 or later,
# and a syntax error inside a stub cannot be suppressed — `ignore_errors`,
# `follow_imports = "skip"` and `exclude` were all measured here on
# 2026-10-21 against numpy 2.5.4 and none of them silence it. So the choice
# was mypy targeting 3.12 or mypy not running at all.
#
# What this costs: mypy no longer flags 3.11+ syntax or stdlib used in code
# that promises 3.10. Nothing else covers that today — CI runs a single 3.12
# job — so it is a real gap, recorded rather than hidden. Closing it means
# exercising the floor where it actually shows: a 3.10 test job.
python_version = "3.12"
ignore_missing_imports = true
